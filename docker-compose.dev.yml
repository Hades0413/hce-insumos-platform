# Modo desarrollo: el código de backend/ y frontend/ se monta en los contenedores y cada
# servicio se recompila al guardar un archivo (NestJS --watch y next dev), sin reconstruir imágenes.
#   make dev
# Requiere las dependencias instaladas en el equipo (make dev ejecuta pnpm install si faltan).
# Se usa la imagen Debian de Node porque node_modules se instala en el equipo (glibc).

x-node-dev: &node-dev
  image: node@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54 # node:24-bookworm-slim
  build: !reset null
  user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
  read_only: false
  environment:
    NEXT_TELEMETRY_DISABLED: "1"
    WATCHPACK_POLLING: "false"
  deploy:
    resources:
      limits: { cpus: "2.0", memory: 1536m }

x-backend-health: &backend-health
  test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9464/metrics').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
  interval: 10s
  timeout: 5s
  retries: 30
  start_period: 60s

services:
  auth-service:
    <<: *node-dev
    working_dir: /app
    command: ["node_modules/.bin/nest", "start", "auth-service", "--watch"]
    volumes: [./backend:/app]
    healthcheck: *backend-health

  inventory-service:
    <<: *node-dev
    working_dir: /app
    command: ["node_modules/.bin/nest", "start", "inventory-service", "--watch"]
    volumes: [./backend:/app]
    healthcheck: *backend-health

  api-gateway:
    <<: *node-dev
    working_dir: /app
    command: ["node_modules/.bin/nest", "start", "api-gateway", "--watch"]
    volumes: [./backend:/app]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/live').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  shell:
    <<: *node-dev
    working_dir: /app/apps/shell
    command: ["node_modules/.bin/next", "dev", "--port", "3000", "--hostname", "0.0.0.0"]
    volumes: [./frontend:/app]
    tmpfs: !override ["/tmp"]
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000/api/v1}
      MF_COMPRAS_URL: http://mf-compras:3001
      MF_VENTAS_URL: http://mf-ventas:3002
      MF_KARDEX_URL: http://mf-kardex:3003
      NEXT_TELEMETRY_DISABLED: "1"

  mf-compras:
    <<: *node-dev
    working_dir: /app/apps/mf-compras
    command: ["node_modules/.bin/next", "dev", "--port", "3001", "--hostname", "0.0.0.0"]
    volumes: [./frontend:/app]
    tmpfs: !override ["/tmp"]
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000/api/v1}
      NEXT_TELEMETRY_DISABLED: "1"

  mf-ventas:
    <<: *node-dev
    working_dir: /app/apps/mf-ventas
    command: ["node_modules/.bin/next", "dev", "--port", "3002", "--hostname", "0.0.0.0"]
    volumes: [./frontend:/app]
    tmpfs: !override ["/tmp"]
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000/api/v1}
      NEXT_TELEMETRY_DISABLED: "1"

  mf-kardex:
    <<: *node-dev
    working_dir: /app/apps/mf-kardex
    command: ["node_modules/.bin/next", "dev", "--port", "3003", "--hostname", "0.0.0.0"]
    volumes: [./frontend:/app]
    tmpfs: !override ["/tmp"]
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000/api/v1}
      NEXT_TELEMETRY_DISABLED: "1"
