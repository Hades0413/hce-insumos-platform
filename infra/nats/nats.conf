# NATS: bus de mensajería interno entre API Gateway y microservicios.
# - TLS obligatorio con certificado firmado por la CA interna (clientes verifican "nats").
# - Subjects versionados: <contexto>.v<n>.<recurso>.<acción>; eventos en <contexto>.v<n>.events.*
# - Mínimo privilegio por cuenta:
#     gateway   -> solo PUBLICA comandos/consultas y escucha eventos de seguridad.
#     servicios -> solo SE SUSCRIBEN a su dominio, RESPONDEN y publican SUS eventos.
#     integraciones -> solo LEEN eventos de integración (p. ej. HIS, facturación, BI).
port: 4222
http: "127.0.0.1:8222"   # monitoreo solo dentro del contenedor (healthcheck), no en la red
max_payload: 1MB
max_connections: 512
write_deadline: "10s"

tls {
  cert_file: "/etc/nats/tls/nats.crt"
  key_file:  "/etc/nats/tls/nats.key"
  timeout: 3
}

authorization {
  users = [
    {
      user: "api_gateway"
      password: $NATS_GATEWAY_PASSWORD
      permissions: {
        publish:   { allow: ["auth.v1.session.>", "auth.v1.health", "auth.v1.admin.>", "inventory.v1.>"],
                     deny:  ["auth.v1.events.>", "inventory.v1.events.>"] }
        subscribe: { allow: ["_INBOX.>", "auth.v1.events.>"] }
      }
    }
    {
      user: "auth_service"
      password: $NATS_AUTH_PASSWORD
      permissions: {
        publish:   { allow: ["auth.v1.events.>"] }
        subscribe: { allow: ["auth.v1.session.>", "auth.v1.health", "auth.v1.admin.>"] }
        allow_responses: true
      }
    }
    {
      user: "inventory_service"
      password: $NATS_INVENTORY_PASSWORD
      permissions: {
        publish:   { allow: ["inventory.v1.events.>"] }
        subscribe: { allow: ["inventory.v1.>"], deny: ["inventory.v1.events.>"] }
        allow_responses: true
      }
    }
    # Plantilla para un consumidor de integración (solo lectura de eventos):
    # {
    #   user: "integraciones"
    #   password: $NATS_INTEGRACIONES_PASSWORD
    #   permissions: { publish: { deny: [">"] }, subscribe: { allow: ["inventory.v1.events.>"] } }
    # }
  ]
}
