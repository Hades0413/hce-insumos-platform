# NATS — bus de mensajería interno (request/reply) entre API Gateway y microservicios.
# Mínimo privilegio por cuenta: el gateway solo PUBLICA comandos; cada servicio
# solo SE SUSCRIBE a su propio dominio y solo puede RESPONDER (allow_responses).
port: 4222
http_port: 8222          # monitoreo (/varz, /connz) — red interna, no publicado
max_payload: 1MB
write_deadline: "10s"

authorization {
  users = [
    {
      user: "api_gateway"
      password: $NATS_GATEWAY_PASSWORD
      permissions: {
        publish:   { allow: ["auth.>", "inventory.>"] }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
    {
      user: "auth_service"
      password: $NATS_AUTH_PASSWORD
      permissions: {
        publish:   { deny: [">"] }
        subscribe: { allow: ["auth.>"] }
        allow_responses: true
      }
    }
    {
      user: "inventory_service"
      password: $NATS_INVENTORY_PASSWORD
      permissions: {
        publish:   { deny: [">"] }
        subscribe: { allow: ["inventory.>"] }
        allow_responses: true
      }
    }
  ]
}
