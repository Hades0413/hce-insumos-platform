# Scrape de métricas RED (rate/errors/duration) y de runtime Node.js de cada servicio.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: api-gateway
    static_configs: [{ targets: ["api-gateway:9464"] }]
  # DNS de Docker: resuelve TODAS las réplicas al escalar (--scale)
  - job_name: auth-service
    dns_sd_configs: [{ names: ["auth-service"], type: A, port: 9464 }]
  - job_name: inventory-service
    dns_sd_configs: [{ names: ["inventory-service"], type: A, port: 9464 }]
