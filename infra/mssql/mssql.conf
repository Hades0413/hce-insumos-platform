# SQL Server: TLS forzado con certificado de la CA interna (los servicios lo verifican
# contra la CA; nada de trustServerCertificate). Memoria acotada para el contenedor.
[network]
tlscert = /etc/ssl/hce/sqlserver.crt
tlskey = /etc/ssl/hce/sqlserver.key
tlsprotocols = 1.2
forceencryption = 1

[memory]
memorylimitmb = 2048
