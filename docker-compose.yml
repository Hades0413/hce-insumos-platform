# =============================================================================
# HCE Insumos: despliegue local unificado (BD + Back + Front)
#   ./scripts/setup.sh            # genera .env (secretos) y secrets/tls (PKI interna)
#   docker compose up -d --build  # levanta todo
#   docker compose --profile monitoring up -d          # + Prometheus y Grafana
#   docker compose up -d --scale inventory-service=3   # escalado horizontal
#
# Redes segmentadas (defensa en profundidad):
#   edge    -> navegador: front (3000) y API Gateway (4000), publicados solo en 127.0.0.1
#   backend -> gateway <-> NATS (TLS) <-> microservicios        (interna, sin salida)
#   data    -> microservicios <-> SQL Server (TLS verificado)   (interna, sin salida)
# Imágenes de terceros fijadas por DIGEST (supply chain reproducible).
# =============================================================================
name: hce-insumos

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  stop_grace_period: 15s
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

x-frontend-build-args: &frontend-build-args
  NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000/api/v1}
  MF_COMPRAS_URL: http://mf-compras:3001
  MF_VENTAS_URL: http://mf-ventas:3002
  MF_KARDEX_URL: http://mf-kardex:3003

x-mssql-image: &mssql-image mcr.microsoft.com/mssql/server@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f

x-service-common-env: &service-common-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  NATS_SERVERS: tls://nats:4222
  NATS_TLS_CA_FILE: /etc/ssl/hce/ca.crt
  METRICS_PORT: "9464"
  DB_HOST: sqlserver
  DB_PORT: "1433"
  DB_ENCRYPT: "true"
  DB_TRUST_SERVER_CERT: "false" # TLS verificado contra la CA interna
  DB_TLS_CA_FILE: /etc/ssl/hce/ca.crt
  DB_REQUEST_TIMEOUT_MS: "6000" # < RPC_TIMEOUT_MS del gateway (8 s)

x-ca-volume: &ca-volume
  type: volume
  source: tls
  target: /etc/ssl/hce
  read_only: true
  volume: { subpath: public }

services:
  # ------------------------------------------------------------------ PKI interna
  # Copia certificados/llaves de ./secrets/tls a un volumen con dueño y permisos
  # mínimos por servicio (SQL Server corre como uid 10001; NATS como root).
  certs-init:
    image: alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
    command:
      - /bin/sh
      - -ec
      - |
        test -s /src/ca.crt || { echo "Falta secrets/tls: ejecuta ./scripts/setup.sh" >&2; exit 1; }
        mkdir -p /tls/public /tls/sqlserver /tls/nats
        install -m 0444 /src/ca.crt /tls/public/ca.crt
        install -o 10001 -g 10001 -m 0444 /src/sqlserver.crt /tls/sqlserver/sqlserver.crt
        install -o 10001 -g 10001 -m 0400 /src/sqlserver.key /tls/sqlserver/sqlserver.key
        install -m 0444 /src/nats.crt /tls/nats/nats.crt
        install -m 0400 /src/nats.key /tls/nats/nats.key
    volumes:
      - ./secrets/tls:/src:ro
      - tls:/tls
    network_mode: none
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    restart: "no"

  # ------------------------------------------------------------------ Datos
  sqlserver:
    image: *mssql-image
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Ejecuta ./scripts/setup.sh}
    volumes:
      - mssql-data:/var/opt/mssql
      - ./infra/mssql/mssql.conf:/var/opt/mssql/mssql.conf:ro
      - { type: volume, source: tls, target: /etc/ssl/hce, read_only: true, volume: { subpath: sqlserver } }
    networks: [data]
    depends_on:
      certs-init: { condition: service_completed_successfully }
    healthcheck:
      # La contraseña viaja por variable de entorno (no aparece en `ps`).
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    # El binario sqlservr declara la capacidad de archivo NET_BIND_SERVICE: es la única que se concede.
    cap_add: ["NET_BIND_SERVICE"]
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 3g }

  db-init:
    image: *mssql-image
    entrypoint: ["/bin/bash", "/scripts/scripts/init-db.sh"]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      INSUMOS_DB_PASSWORD: ${INSUMOS_DB_PASSWORD:?Ejecuta ./scripts/setup.sh}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Ejecuta ./scripts/setup.sh}
      DB_HOST: sqlserver
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
    volumes:
      - ./database:/scripts:ro
    networks: [data]
    depends_on:
      sqlserver: { condition: service_healthy }
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    read_only: true
    tmpfs: ["/tmp"]
    restart: "no"

  # ------------------------------------------------------------------ Mensajería
  nats:
    image: nats@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    command: ["-c", "/etc/nats/nats.conf"]
    environment:
      NATS_GATEWAY_PASSWORD: ${NATS_GATEWAY_PASSWORD:?Ejecuta ./scripts/setup.sh}
      NATS_AUTH_PASSWORD: ${NATS_AUTH_PASSWORD}
      NATS_INVENTORY_PASSWORD: ${NATS_INVENTORY_PASSWORD}
    volumes:
      - ./infra/nats/nats.conf:/etc/nats/nats.conf:ro
      - { type: volume, source: tls, target: /etc/nats/tls, read_only: true, volume: { subpath: nats } }
    networks: [backend]
    depends_on:
      certs-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    <<: *hardening

  # ------------------------------------------------------------------ Microservicios
  auth-service:
    build: { <<: *backend-build, args: { APP: auth-service } }
    image: hce-insumos/auth-service:local
    environment:
      <<: *service-common-env
      NATS_USER: auth_service
      NATS_PASSWORD: ${NATS_AUTH_PASSWORD}
      DB_NAME: HCE_Auth
      DB_USER: hce_auth_app
      DB_PASSWORD: ${AUTH_DB_PASSWORD}
      DB_POOL_MAX: "10"
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY_B64:?Ejecuta ./scripts/setup.sh}
      JWT_ACCESS_TTL_MIN: "30"
      JWT_REFRESH_TTL_HOURS: "8"
      SESSION_MAX_HOURS: "12"
      SEED_DEMO_USERS: ${SEED_DEMO_USERS:-false}
      SEED_USERS_PASSWORD: ${SEED_USERS_PASSWORD:-}
      UV_THREADPOOL_SIZE: "8" # argon2id se ejecuta en el threadpool de libuv
    volumes: [*ca-volume]
    networks: [backend, data]
    depends_on:
      db-init: { condition: service_completed_successfully }
      nats: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9464/metrics"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384m }
    <<: *hardening

  inventory-service:
    build: { <<: *backend-build, args: { APP: inventory-service } }
    image: hce-insumos/inventory-service:local
    environment:
      <<: *service-common-env
      NATS_USER: inventory_service
      NATS_PASSWORD: ${NATS_INVENTORY_PASSWORD}
      DB_NAME: HCE_Insumos
      DB_USER: hce_insumos_app
      DB_PASSWORD: ${INSUMOS_DB_PASSWORD}
      DB_POOL_MAX: "20"
      IGV_RATE: ${IGV_RATE:-0.18}
      MARGEN_VENTA: ${MARGEN_VENTA:-0.35}
    volumes: [*ca-volume]
    networks: [backend, data]
    depends_on:
      db-init: { condition: service_completed_successfully }
      nats: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9464/metrics"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384m }
    <<: *hardening

  # ------------------------------------------------------------------ API Gateway
  api-gateway:
    build: { <<: *backend-build, args: { APP: api-gateway } }
    image: hce-insumos/api-gateway:local
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: "4000"
      API_PREFIX: api/v1
      METRICS_PORT: "9464"
      NATS_SERVERS: tls://nats:4222
      NATS_TLS_CA_FILE: /etc/ssl/hce/ca.crt
      NATS_USER: api_gateway
      NATS_PASSWORD: ${NATS_GATEWAY_PASSWORD}
      CORS_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3000}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY_B64:?Ejecuta ./scripts/setup.sh}
      CSRF_SECRET: ${CSRF_SECRET:?Ejecuta ./scripts/setup.sh}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      # Solo desarrollo: precarga la contraseña demo en el ejemplo de login de Swagger.
      SWAGGER_DEMO_PASSWORD: ${SWAGGER_DEMO_PASSWORD:-}
      THROTTLE_TTL_MS: "60000"
      THROTTLE_LIMIT: "300"
      LOGIN_THROTTLE_LIMIT: "10"
      RPC_TIMEOUT_MS: "8000"
      # Número exacto de proxies delante (0 = conexión directa). Nunca "true": un
      # X-Forwarded-For falsificado evadiría el rate limit.
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes: [*ca-volume]
    ports:
      - "127.0.0.1:4000:4000"
    networks: [edge, backend]
    depends_on:
      nats: { condition: service_healthy }
      auth-service: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/api/v1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384m }
    <<: *hardening

  # ------------------------------------------------------------------ Frontend (Multi-Zones)
  shell:
    build:
      context: ./frontend
      args: { <<: *frontend-build-args, APP: shell }
    image: hce-insumos/shell:local
    environment:
      PORT: "3000"
      APP_PUBLIC_URL: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    networks: [edge]
    depends_on:
      mf-compras: { condition: service_started }
      mf-ventas: { condition: service_started }
      mf-kardex: { condition: service_started }
      api-gateway: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 384m }
    <<: *hardening
    tmpfs: ["/tmp", "/app/apps/shell/.next/cache"]

  mf-compras:
    build:
      context: ./frontend
      args: { <<: *frontend-build-args, APP: mf-compras, PORT: "3001" }
    image: hce-insumos/mf-compras:local
    environment:
      PORT: "3001"
      APP_PUBLIC_URL: ${FRONTEND_ORIGIN:-http://localhost:3000}
    networks: [edge]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
    <<: *hardening
    tmpfs: ["/tmp", "/app/apps/mf-compras/.next/cache"]

  mf-ventas:
    build:
      context: ./frontend
      args: { <<: *frontend-build-args, APP: mf-ventas, PORT: "3002" }
    image: hce-insumos/mf-ventas:local
    environment:
      PORT: "3002"
      APP_PUBLIC_URL: ${FRONTEND_ORIGIN:-http://localhost:3000}
    networks: [edge]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
    <<: *hardening
    tmpfs: ["/tmp", "/app/apps/mf-ventas/.next/cache"]

  mf-kardex:
    build:
      context: ./frontend
      args: { <<: *frontend-build-args, APP: mf-kardex, PORT: "3003" }
    image: hce-insumos/mf-kardex:local
    environment:
      PORT: "3003"
      APP_PUBLIC_URL: ${FRONTEND_ORIGIN:-http://localhost:3000}
    networks: [edge]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }
    <<: *hardening
    tmpfs: ["/tmp", "/app/apps/mf-kardex/.next/cache"]

  # ------------------------------------------------------------------ Observabilidad (opcional)
  prometheus:
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [backend, monitoring]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    restart: unless-stopped

  grafana:
    image: grafana/grafana@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Ejecuta ./scripts/setup.sh}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3100:3000"
    networks: [monitoring]
    depends_on: [prometheus]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped

networks:
  edge: {}
  backend:
    internal: true
  data:
    internal: true
  monitoring: {}

volumes:
  mssql-data:
  tls:
  prometheus-data:
  grafana-data:
